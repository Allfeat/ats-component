name: Deploy Component (Dev)

on:
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'package.json'
      - 'rollup.config.js'
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: [self-hosted, Linux, X64, ovh]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload dev files to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com
        run: |
          BUCKET="${{ secrets.R2_BUCKET_NAME }}"

          for file in ats-widget.iife.js ats-widget.esm.js; do
            if [ -f "dist/$file" ]; then
              aws s3 cp "dist/$file" "s3://$BUCKET/dev/$file" \
                --endpoint-url "$R2_ENDPOINT" \
                --region auto \
                --content-type "application/javascript" \
                --cache-control "public, max-age=300"
            fi
          done

      - name: Summary
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "## Dev Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** \`$VERSION-dev\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### URLs" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Dev URL |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| IIFE | \`https://cdn.allfeat.org/widgets/ats/dev/ats-widget.iife.js\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ESM  | \`https://cdn.allfeat.org/widgets/ats/dev/ats-widget.esm.js\`  |" >> "$GITHUB_STEP_SUMMARY"
